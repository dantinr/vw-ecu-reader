[platformio]
default_envs = obd2_read
boards_dir = boards
lib_dir = libraries
src_dir = examples/obd2_read

[env:obd2_read]
extra_scripts = pre:scripts/firmware_version.py
platform = espressif32 @ 6.5.0
board = esp32s3_flash_16MB
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:obd2_read_diag]
extends = env:obd2_read
build_flags =
    ${env:obd2_read.build_flags}
    -D OBD2_CAPTURE_TWAI_ERRORS
    -Wl,--wrap=twai_hal_get_events
